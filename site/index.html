<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beads — трекер привычек</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><line x1='2' y1='16' x2='30' y2='16' stroke='%23a3aec0' stroke-width='2'/><circle cx='9' cy='16' r='6' fill='%234F8A5B'/><circle cx='23' cy='16' r='6' fill='%233A5CCC'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root { --paper:#e8edf3; --ink:#1e2740; --soft:#5a6480; --line:#cbd3de; --thread:#a3aec0; }
      @media (prefers-color-scheme: dark) {
        :root { --paper:#161c2b; --ink:#e6eaf2; --soft:#98a2b8; --line:#323b52; --thread:#4a5470; }
      }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px;
        background:var(--paper); color:var(--ink); font-family:'Onest',system-ui,sans-serif; line-height:1.5; }
      main { max-width:560px; }
      .thread { position:relative; display:flex; gap:10px; margin-bottom:28px; }
      .thread::before { content:''; position:absolute; inset:50% 0 auto; height:2px; background:var(--thread); }
      .thread span { position:relative; width:22px; height:22px; border-radius:50%;
        background:radial-gradient(circle at 34% 30%,rgb(255 255 255/.55) 0 14%,transparent 16%),var(--c); }
      h1 { margin:0 0 12px; font-family:'Unbounded',system-ui,sans-serif; font-size:clamp(2rem,7vw,3.2rem); letter-spacing:-.035em; line-height:1; }
      p { margin:0 0 28px; color:var(--soft); }
      nav { display:flex; flex-wrap:wrap; gap:12px; }
      a { display:inline-flex; align-items:center; min-height:48px; padding:10px 22px; border-radius:999px;
        border:1.5px solid var(--ink); color:var(--ink); text-decoration:none; font-weight:600; }
      a:first-child { background:var(--ink); color:var(--paper); }
      a:hover { opacity:.85; }
      a:focus-visible { outline:2px solid #3a5ccc; outline-offset:3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="thread" aria-hidden="true">
        <span style="--c:#4F8A5B"></span><span style="--c:#4F8A5B"></span><span style="--c:#3A5CCC"></span>
        <span style="--c:#8A4FA0"></span><span style="--c:#C08A1E"></span>
      </div>
      <h1>Beads</h1>
      <p>Трекер привычек, где каждый выполненный день — бусина на нитке. Одно приложение в двух реализациях: выберите, какую открыть. Данные у версий общие, если открывать их в одном браузере.</p>
      <nav>
        <a href="./react/">Версия на React</a>
        <a href="./vue/">Версия на Vue</a>
      </nav>
    </main>
  </body>
</html>
